name: test

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "public/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/test.yml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: npm test
