name: collect

on:
  schedule:
    - cron: "*/51 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Write Firebase credentials
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # GitHub's `schedule` trigger is best-effort and silently drops events
      # under load — a bare */10 cron was actually firing every 17-84 min.
      # So this step polls internally for ~50 min per run; the cron just
      # restarts it, and `concurrency: collect` (cancel-in-progress: false)
      # keeps one successor queued so the next hour starts the instant this
      # one ends.
      - name: Collect snapshots for ~50 minutes
        shell: bash
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          POLL_SECONDS: "300"
          RUN_SECONDS: "3300"
        run: |
          attempts=0; failures=0
          while :; do
            attempts=$(( attempts + 1 ))
            if ! node scripts/collect.mjs; then
              failures=$(( failures + 1 ))
              echo "::warning::collect failed (attempt $attempts, failure $failures)"
            fi
            if (( SECONDS + POLL_SECONDS >= RUN_SECONDS )); then break; fi
            sleep "$POLL_SECONDS"
          done
          echo "Completed $attempts collections, $failures failures."
          if (( failures == attempts )); then
            echo "::error::every collection attempt failed"
            exit 1
          fi
      # Distinct from the check above: that one reports process failure,
      # this one reports data freshness (quota exhaustion, a silently wedged
      # collector, or a Screeps API outage can all leave meta/latest stale
      # even when individual collect.mjs runs "succeed").
      - name: Check data freshness
        run: node scripts/check-freshness.mjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          STALE_MINUTES: "40"
