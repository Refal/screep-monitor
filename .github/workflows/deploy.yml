name: deploy

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "public/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # public/calc.js has no imports and the test suite only pulls in
      # node:test/node:assert — no npm install needed to run it.
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # Fail closed if a real key ever gets committed to
      # public/firebase-config.js instead of generated at deploy time.
      - name: Check no secrets committed
        run: node scripts/check-no-secrets.mjs
      - name: Generate firebase-config.js
        run: node scripts/gen-web-config.mjs
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
      - name: Write deploy credentials
        run: printf '%s' "$FIREBASE_DEPLOY_SA" > "$RUNNER_TEMP/deploy-sa.json"
        env:
          FIREBASE_DEPLOY_SA: ${{ secrets.FIREBASE_DEPLOY_SA }}
      # Pinned deliberately — leave it pinned rather than letting npx pull
      # whatever's newest on each deploy. Bump intentionally when needed.
      - name: Deploy hosting + firestore rules
        run: npx --yes firebase-tools@15.28.1 deploy --only hosting,firestore:rules --project screeps-52c72 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/deploy-sa.json
